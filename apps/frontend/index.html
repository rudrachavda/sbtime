<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="color-scheme" content="light dark" />
	<link rel="preconnect" href="https://rsms.me" crossorigin />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<meta name="description"
		content="UCSB's online course discovery platform. SBTime is a platform built, maintained, and run by students, just like you. We work hard to simplify and improve the course discovery experience." />
	<title>SBTime</title>

	<!-- Open Graph / Facebook / Discord / LinkedIn / iMessage -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://ucsbtime.com/" />
	<meta property="og:title" content="SBTime" />
	<meta property="og:description"
		content="UCSB's online course discovery platform. SBTime is a platform built, maintained, and run by students, just like you." />
	<meta property="og:image" content="https://ucsbtime.com/images/linkpreview.png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />

	<!-- Twitter / X -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:url" content="https://ucsbtime.com/" />
	<meta name="twitter:title" content="SBTime" />
	<meta name="twitter:description"
		content="UCSB's online course discovery platform. SBTime is a platform built, maintained, and run by students, just like you." />
	<meta name="twitter:image" content="https://ucsbtime.com/images/linkpreview.png" />
</head>

<body>
	<script>
		// Set theme before first paint to prevent color flash (FOUC).
		// Mirrors ThemeProvider logic: localStorage "theme" → data-theme attribute.
		(function () {
			var theme = localStorage.getItem("theme");
			if (theme === "dark" || theme === "light") {
				document.body.setAttribute("data-theme", theme);
			} else {
				var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
				document.body.setAttribute("data-theme", prefersDark ? "dark" : "light");
			}
		})();
	</script>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
